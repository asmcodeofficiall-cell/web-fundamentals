<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper - WebDataRocks</title>
    <link href="https://cdn.webdatarocks.com/latest/webdatarocks.min.css" rel="stylesheet"/>
    <script src="https://cdn.webdatarocks.com/latest/webdatarocks.js"></script>
    <link href="style.css" rel="stylesheet"/>
</head>
<body>
    <div id="settings">
        <h1>Сапер</h1>
        <div class="controls">
            <select id="difficulty">
                <option value="beginner">Новачок</option>
                <option value="intermediate">Середній</option>
                <option value="expert">Експерт</option>
            </select>
        </div>
        <div id="status">Граємо!</div>
    </div>
    
    <div id="game-window">
        <div id="top-panel">
            <div id="mine-counter" class="led">010</div>
            <button id="smiley-btn">🙂</button>
            <div id="timer" class="led">000</div>
        </div>
        <div id="grid-container">
            <div id="wdr-container"></div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
